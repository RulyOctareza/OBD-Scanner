name: autocare
description: "AutoCare - Your silent car companion"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  clock: ^1.1.1

  # State Management & DI
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # Local Database (Drift/SQLite)
  drift: ^2.16.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.2
  path: ^1.9.0

  # Storage & Permissions
  shared_preferences: ^2.2.2
  permission_handler: ^11.3.1

  # Localization & Charting
  intl: ^0.19.0
  fl_chart: ^0.68.0

  # Bluetooth Classic (SPP)
  # Vendored with Android patches, see packages/flutter_bluetooth_serial/LOCAL_CHANGES.md.
  flutter_bluetooth_serial:
    path: packages/flutter_bluetooth_serial

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_async: ^1.3.1
  flutter_lints: ^5.0.0

  # Code Generation
  drift_dev: ^2.16.0
  riverpod_generator: ^2.3.9
  build_runner: ^2.4.8
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/fonts/Inter-OFL.txt

  # Inter 4.1 (OFL, assets/fonts/Inter-OFL.txt), subset to Latin, Latin-1 and
  # Latin Extended-A plus punctuation, currency, arrows and math symbols, with
  # every OpenType feature kept (tabular figures for numbers). Bundled because
  # release builds have no INTERNET permission to fetch fonts at runtime.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0F1115"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  min_sdk_android: 21
